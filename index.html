
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Keep track of where your money goes.</p>
        </header>

        <section class="summary">
            <p id="total-label">Total Expenses Today</p>
            <h2 id="total">₹0.00</h2>
        </section>

        <section class="form-section">
            <h2 id="form-heading">Add Expense</h2>

            <form id="expense-form">
                <label for="title">Expense name</label>
                <input type="text" id="title" placeholder="e.g. Lunch" required maxlength="100">

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" placeholder="e.g. 150" min="0.01" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <label for="expense-date">Date</label>
                <input type="date" id="expense-date" required>

                <div class="form-actions">
                    <button type="submit" id="save-button">Add Expense</button>
                    <button type="button" id="cancel-button" hidden>Cancel Edit</button>
                </div>
            </form>
        </section>

        <section class="expenses-section">
            <h2>Expenses</h2>

            <div class="filters">
                <label for="view-mode">View</label>
                <select id="view-mode">
                    <option value="daily">Daily</option>
                    <option value="monthly">Monthly</option>
                </select>

                <label for="filter-date" id="date-label">Select date</label>
                <input type="date" id="filter-date">

                <label for="filter-month" id="month-label" hidden>Select month</label>
                <input type="month" id="filter-month" hidden>
            </div>

            <p id="expense-count">0 expenses</p>
            <ul id="expense-list"></ul>
        </section>

        <footer>
            <p>Your expenses are saved in this browser.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
